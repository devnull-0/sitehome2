# nginx server configuration for pwistudio.com (static site, no scripts).
#
# Install:
#   sudo cp -r public/ /var/www/pwistudio.com/
#   sudo cp server/nginx/security-headers.conf /etc/nginx/snippets/
#   sudo cp server/nginx/pwistudio.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pwistudio.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: e.g. `sudo certbot certonly --webroot -w /var/www/pwistudio.com
#   -d pwistudio.com -d www.pwistudio.com`, then check the paths below.
#
# Each server block hides the nginx version (server_tokens off); you can
# also set it once in the http {} block of nginx.conf.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pwistudio.com www.pwistudio.com;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pwistudio.com;
        default_type "text/plain";
    }
    location / {
        return 301 https://pwistudio.com$request_uri;
    }
}

# www -> bare domain
server {
    listen 443 ssl http2;       # nginx >= 1.25.1: "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name www.pwistudio.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pwistudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwistudio.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://pwistudio.com$request_uri;
}

server {
    listen 443 ssl http2;       # nginx >= 1.25.1: "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name pwistudio.com;

    root /var/www/pwistudio.com/public;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain image/svg+xml application/xml;
    autoindex off;
    server_tokens off;

    # TLS: Mozilla "intermediate" profile
    ssl_certificate     /etc/letsencrypt/live/pwistudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwistudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:pwistudio:10m;
    ssl_session_tickets off;

    # Small requests only: there is nothing to upload.
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    large_client_header_buffers 4 8k;

    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # Static site: only GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # nginx drops parent add_header lines when a location adds its own,
    # so every location includes the full header set.
    include /etc/nginx/snippets/security-headers.conf;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hidden files (except /.well-known/) and config files never leave the server.
    location ~ /\.(?!well-known/) { return 404; }
    location = /_headers          { return 404; }
    location ~* \.(php\d?|phtml|phar|pl|py|cgi|sh|asp|aspx|jsp|bak|old|orig|swp|log|ini|conf|env|md|yml|yaml|sql|zip|tar|gz)$ { return 404; }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
